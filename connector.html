    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Inter:wght@300;400;700;800&display=swap');
        
        body {
            background-color: #0a0a0a;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            letter-spacing: -0.01em;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .glass {
            background: rgba(23, 23, 23, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(30, 30, 30, 0.8);
            transform: translateY(-2px);
        }

        .category-tab {
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .category-tab.active {
            border-color: #f97316;
            color: #f97316;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .hero-gradient {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.1) 0%, rgba(239, 68, 68, 0.05) 50%, rgba(234, 179, 8, 0.1) 100%);
            border: 1px solid rgba(249, 115, 22, 0.2);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #404040; }

        .featured-badge {
            background: linear-gradient(90deg, #f97316, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>

        function init() {
            fullCatalog = CATALOG_DATA;
            
            // Find featured project
            featuredProject = fullCatalog.find(item => item.featured === true);
            if (featuredProject) {
                renderFeaturedHero();
                document.getElementById('featured-hero').classList.remove('hidden');
            }
            
            updateStats();
            renderCatalog();
        }

        function renderFeaturedHero() {
            if (!featuredProject) return;
            
            document.getElementById('featured-name').textContent = featuredProject.name;
            document.getElementById('featured-summary').textContent = featuredProject.summary;
            document.getElementById('featured-category').textContent = featuredProject.category;
            document.getElementById('featured-icon').className = getIcon(featuredProject.category).replace('text-xl', 'text-4xl');
            
            const folderBtn = document.getElementById('featured-folder');
            folderBtn.href = `file://${featuredProject.path}`;
            
            const launchBtn = document.getElementById('featured-launch');
            if (featuredProject.entryPoint) {
                launchBtn.href = featuredProject.entryPoint;
                launchBtn.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                launchBtn.classList.add('opacity-50', 'pointer-events-none');
            }
        }

        function handleSearch(val) {
            searchQuery = val.toLowerCase();
            renderCatalog();
        }

        function updateStats() {
            const launchableCount = fullCatalog.filter(item => item.entryPoint !== null).length;
            const now = new Date();
            const lastUpdated = now.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('lastUpdated').textContent = lastUpdated;
            document.getElementById('stats').innerHTML = `
                ${fullCatalog.length} ASSETS TOTAL | ${launchableCount} LAUNCHABLE | 
                <span class="text-green-500">STATUS: NOMINAL</span>
            `;
        }

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.category-tab').forEach(el => {
                el.classList.toggle('active', el.innerText.toLowerCase() === cat.toLowerCase() || (cat === 'All' && el.innerText === 'All Assets'));
            });
            renderCatalog();
        }

        function renderCatalog() {
            const container = document.getElementById('catalog');
            let filtered = currentFilter === 'All' ? fullCatalog : fullCatalog.filter(item => item.category === currentFilter);
            
            if (searchQuery) {
                filtered = filtered.filter(item => 
                    item.name.toLowerCase().includes(searchQuery) || 
                    item.summary.toLowerCase().includes(searchQuery) ||
                    item.category.toLowerCase().includes(searchQuery)
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center text-neutral-500 mono py-20 uppercase text-xs tracking-widest">No assets found matching criteria.</div>';
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="glass p-6 rounded-xl relative group overflow-hidden flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <div class="p-3 bg-neutral-900 rounded-lg group-hover:bg-orange-500/10 transition-colors">
                                <i class="${getIcon(item.category)} text-xl text-neutral-400 group-hover:text-orange-500 transition-colors"></i>
                            </div>
                            <span class="mono text-[10px] uppercase tracking-tighter text-neutral-600 bg-neutral-900/50 px-2 py-1 rounded">${item.category}</span>
                        </div>
                        <h3 class="text-lg font-bold mb-2 group-hover:text-white transition-colors">${item.name}</h3>
                        <p class="text-sm text-neutral-500 leading-relaxed mb-6 h-10 overflow-hidden text-ellipsis line-clamp-2">${item.summary}</p>
                    </div>
                    <div class="flex gap-2">
                        <a href="file://${item.path}" class="flex-1 bg-neutral-900 hover:bg-neutral-800 text-neutral-300 mono text-[10px] font-bold uppercase tracking-widest py-3 text-center rounded transition-all">
                            <i class="fas fa-folder mr-1"></i> Folder
                        </a>
                        ${item.entryPoint ? `
                        <a href="${item.entryPoint}" target="_blank" class="flex-1 bg-orange-600 hover:bg-orange-500 text-white mono text-[10px] font-bold uppercase tracking-widest py-3 text-center rounded shadow-lg shadow-orange-900/20 transition-all">
                            <i class="fas fa-external-link-alt mr-1"></i> Launch
                        </a>
                        ` : `
                        <button disabled class="flex-1 bg-neutral-800 text-neutral-600 mono text-[10px] font-bold uppercase tracking-widest py-3 text-center rounded cursor-not-allowed">
                            <i class="fas fa-ban mr-1"></i> N/A
                        </button>
                        `}
                    </div>
                </div>
            `).join('');
        }

        function getIcon(category) {
            const iconMap = {
                'Platforms': 'fas fa-layer-group',
                'Research': 'fas fa-microscope',
                'Content': 'fas fa-pen-nib',
                'Utilities': 'fas fa-wrench',
                'Games': 'fas fa-gamepad'
            };
            return iconMap[category] || 'fas fa-cube';
        }

        init();
    </script>
