<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monetization Pipeline | Ezra</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        h1 { font-size: 24px; color: #fff; }
        .updated { color: #666; font-size: 14px; }
        
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .metric {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
        }
        .metric-label { color: #888; font-size: 12px; text-transform: uppercase; }
        .metric-value { font-size: 32px; font-weight: bold; color: #fff; margin: 10px 0; }
        .metric-target { color: #666; font-size: 14px; }
        .metric.urgent .metric-value { color: #ff6b6b; }
        .metric.good .metric-value { color: #51cf66; }
        
        .section {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .section h2 {
            font-size: 16px;
            color: #888;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        
        .product {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #252525;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .product-info { flex: 1; }
        .product-name { font-weight: bold; color: #fff; }
        .product-status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            text-transform: uppercase;
            margin-left: 10px;
        }
        .status-live { background: #2d8a4e; color: #fff; }
        .status-researching { background: #c9a227; color: #000; }
        .status-building { background: #4a90d9; color: #fff; }
        .product-action { color: #888; font-size: 13px; margin-top: 5px; }
        .product-revenue { text-align: right; }
        .revenue-value { font-size: 20px; font-weight: bold; }
        .revenue-label { font-size: 11px; color: #666; }
        
        .opportunity {
            padding: 15px;
            background: #252525;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid #4a90d9;
        }
        .opp-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .opp-name { font-weight: bold; }
        .opp-price { color: #51cf66; font-weight: bold; }
        .opp-detail { color: #888; font-size: 13px; margin-bottom: 5px; }
        .opp-concerns { color: #ff6b6b; font-size: 12px; }
        
        .checks {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .check {
            padding: 10px 15px;
            background: #252525;
            border-radius: 8px;
            font-size: 13px;
        }
        .check.done { background: #2d8a4e; }
        .check.pending { background: #333; }
        
        .refresh-btn {
            background: #4a90d9;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .refresh-btn:hover { background: #3a7bc8; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>⚡ Monetization Pipeline</h1>
                <p class="updated" id="lastUpdated">Loading...</p>
            </div>
            <button class="refresh-btn" onclick="loadData()">Refresh</button>
        </header>
        
        <div class="metrics">
            <div class="metric urgent">
                <div class="metric-label">This Week</div>
                <div class="metric-value" id="weekRevenue">$0</div>
                <div class="metric-target">Target: $100</div>
            </div>
            <div class="metric">
                <div class="metric-label">Total Revenue</div>
                <div class="metric-value" id="totalRevenue">$0</div>
                <div class="metric-target">Feb Goal: $2,600</div>
            </div>
            <div class="metric">
                <div class="metric-label">Products Live</div>
                <div class="metric-value" id="productsLive">3</div>
                <div class="metric-target">5 in pipeline</div>
            </div>
            <div class="metric">
                <div class="metric-label">Leads</div>
                <div class="metric-value" id="leads">0</div>
                <div class="metric-target">Target: 10</div>
            </div>
        </div>
        
        <div class="section">
            <h2>Products & Revenue</h2>
            <div id="productsList">Loading...</div>
        </div>
        
        <div class="section">
            <h2>Active Opportunities</h2>
            <div id="opportunitiesList">Loading...</div>
        </div>
        
        <div class="section">
            <h2>Daily Research Checks</h2>
            <div class="checks" id="dailyChecks">
                <span class="check">Reddit</span>
                <span class="check">Twitter</span>
                <span class="check">HN</span>
            </div>
        </div>
    </div>
    
    <script>
        const DATA_URL = 'pipeline-data.json';
        
        async function loadData() {
            try {
                const response = await fetch(DATA_URL + '?t=' + Date.now());
                const data = await response.json();
                render(data);
            } catch (err) {
                console.error('Failed to load data:', err);
            }
        }
        
        function render(data) {
            document.getElementById('lastUpdated').textContent = 
                'Updated: ' + new Date(data.lastUpdated).toLocaleString();
            
            // Metrics
            const total = data.products.reduce((sum, p) => sum + (p.revenue || 0), 0);
            document.getElementById('totalRevenue').textContent = '$' + total;
            document.getElementById('weekRevenue').textContent = '$' + (data.revenue.actual.week1 || 0);
            document.getElementById('productsLive').textContent = 
                data.products.filter(p => p.status === 'live').length;
            
            // Products
            const productsHtml = data.products.map(p => `
                <div class="product">
                    <div class="product-info">
                        <span class="product-name">${p.name}</span>
                        <span class="product-status status-${p.status}">${p.status}</span>
                        <div class="product-action">Next: ${p.nextAction}</div>
                    </div>
                    <div class="product-revenue">
                        <div class="revenue-value">$${p.revenue || 0}</div>
                        <div class="revenue-label">revenue</div>
                    </div>
                </div>
            `).join('');
            document.getElementById('productsList').innerHTML = productsHtml;
            
            // Opportunities
            const oppHtml = data.opportunities.map(o => `
                <div class="opportunity">
                    <div class="opp-header">
                        <span class="opp-name">${o.name}</span>
                        <span class="opp-price">$${o.price}</span>
                    </div>
                    <div class="opp-detail"><strong>Pain:</strong> ${o.painPoint}</div>
                    <div class="opp-detail"><strong>Solution:</strong> ${o.solution}</div>
                    <div class="opp-detail"><strong>Source:</strong> ${o.source}</div>
                    ${o.concerns ? `<div class="opp-concerns">⚠️ ${o.concerns.join(', ')}</div>` : ''}
                </div>
            `).join('');
            document.getElementById('opportunitiesList').innerHTML = oppHtml || 
                '<p style="color:#666">No opportunities yet. Run research to find pain points.</p>';
            
            // Daily checks
            const checksHtml = [
                { name: 'Reddit', done: data.dailyChecks?.reddit },
                { name: 'Twitter', done: data.dailyChecks?.twitter },
                { name: 'HN', done: data.dailyChecks?.hn }
            ].map(c => `<span class="check ${c.done ? 'done' : 'pending'}">${c.name}</span>`).join('');
            document.getElementById('dailyChecks').innerHTML = checksHtml;
        }
        
        loadData();
        setInterval(loadData, 60000); // Refresh every minute
    </script>
</body>
</html>
