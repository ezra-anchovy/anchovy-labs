<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Background — Anchovy Labs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0c0a09;
            color: #fafaf8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        p {
            color: rgba(250, 250, 248, 0.5);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .preview {
            max-width: 960px;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .preview img {
            width: 100%;
            height: auto;
            display: block;
        }
        .dl {
            margin-top: 1.5rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.4rem;
            border-radius: 8px;
            background: rgba(191, 107, 71, 0.15);
            color: #bf6b47;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            border: 1px solid rgba(191, 107, 71, 0.25);
            transition: background 0.2s;
        }
        .dl:hover { background: rgba(191, 107, 71, 0.25); }
        .specs {
            margin-top: 1rem;
            color: rgba(250, 250, 248, 0.3);
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <h1>Anchovy Labs — Zoom Background</h1>
    <p>1920 × 1080 · Dark minimal with subtle grid</p>
    <div class="preview">
        <img src="assets/zoom-bg.png" alt="Anchovy Labs Zoom background — dark with subtle grid and logo">
    </div>
    <a class="dl" href="assets/zoom-bg.png" download="anchovy-labs-zoom-bg.png">↓ Download PNG</a>
    <div class="specs">Optimized for Zoom, Google Meet, Teams · 1920×1080 PNG</div>
</body>
</html>
